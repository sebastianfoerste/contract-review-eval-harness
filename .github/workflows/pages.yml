name: pages

# Publishes the committed evidence as a static site: the scorecard, the release
# certificate, the dated live-run report, the leaderboard and the adversarial
# robustness report. scripts/build_site.py renders them with the standard library
# only, so the build needs no network beyond installing uv. The site also carries the
# playground (playground/), which installs the wheel built here into Pyodide and
# scores a pasted review in the visitor's browser.
#
# The site is published at https://sebastianfoerste.github.io/contract-review-eval-harness/
# (Settings > Pages > Source is "GitHub Actions"). A deploy to a repository without
# Pages fails, so the deploy job only runs when the repository variable PAGES_ENABLED
# is 'true' (Settings > Secrets and variables > Actions > Variables). Any other value
# turns deployment off. The build job always runs, so a renderer that breaks still
# fails here even while deployment is off.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build the wheel the playground installs
        run: uv build --wheel --out-dir build/playground-wheel

      - name: Render the site
        run: uv run python scripts/build_site.py --out site --wheel build/playground-wheel/contract_eval-*.whl

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
