name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest -v

      - name: Run baseline suite evaluation gate
        run: uv run python -m contract_eval evaluate --case all

      - name: Run comparison regression test
        run: uv run python -m contract_eval compare

      - name: Verify the committed release certificate
        run: uv run python scripts/check_release_certificate.py

      - name: Recompute the release certificate from source inputs
        run: uv run python -m contract_eval verify-certificate --certificate examples/release-certificate.json

      - name: Verify the adversarial robustness campaign
        run: uv run python -m contract_eval verify-robustness --report examples/adversarial-robustness-report.json --campaign robustness/campaign.v1.json

      - name: Check the committed robustness artifacts
        run: uv run python scripts/check_robustness_report.py
