# Weekly update pull requests for the SHA-pinned actions (the workflows and the
# composite action.yml at the root) and for the Python dependencies in uv.lock.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
