[project]
name = "contract-eval"
version = "0.7.0rc1"
description = "Evaluation harness that measures the quality of AI contract review — clause extraction, risk flags, source citations — against a hand-authored answer set. Synthetic data, deterministic by default."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sebastianfoerste", email = "sebastianfoerste@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "contract-review",
    "legal-ai",
    "evaluation-harness",
    "benchmark",
    "citation-grounding",
    "hallucination",
    "gdpr",
    "release-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# Optional: only needed for the --live adapter. The default offline path needs none of this.
# 0.77.0 is the first release whose non-beta `messages.parse` takes `output_format` and
# `output_config`, which the adapter passes. tests/test_live_sdk_contract.py holds the
# floor: it fails if the installed SDK's `parse` no longer accepts what the adapter sends.
live = [
    "anthropic>=0.77.0",
]

[project.urls]
Homepage = "https://sebastianfoerste.github.io/contract-review-eval-harness/"
Source = "https://github.com/sebastianfoerste/contract-review-eval-harness"
Documentation = "https://github.com/sebastianfoerste/contract-review-eval-harness/blob/main/docs/overview.md"
Changelog = "https://github.com/sebastianfoerste/contract-review-eval-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/sebastianfoerste/contract-review-eval-harness/issues"

[project.scripts]
contract-eval = "contract_eval.cli:main"

# Loads contract_eval.pytest_plugin in any pytest run where the package is installed.
[project.entry-points.pytest11]
contract_eval = "contract_eval.pytest_plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_eval"]

# The bundled cases ship inside the wheel, so an install without a checkout can run
# them. The repository copies stay where they are: committed certificates record their
# paths and hashes. `contract_eval.paths` prefers a checkout and falls back to these.
[tool.hatch.build.targets.wheel.force-include]
"data" = "contract_eval/_bundled/data"
"expected" = "contract_eval/_bundled/expected"
"fixtures" = "contract_eval/_bundled/fixtures"
"robustness/campaign.v1.json" = "contract_eval/_bundled/robustness/campaign.v1.json"
"annotations/drafts" = "contract_eval/_bundled/annotations/drafts"

[tool.hatch.build.targets.sdist]
# Anchored patterns: a bare "data" would also match candidates/data.
include = [
    "/src",
    "/data",
    "/expected",
    "/fixtures",
    "/robustness/campaign.v1.json",
    "/annotations/drafts",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

# CI runs `uv run ruff check src tests scripts`; the tree is not run through
# `ruff format`.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's long-standing default rule set (pyflakes and the pycodestyle E4/E7/E9
# errors), spelled out: ruff 0.17's built-in default enables several hundred rules
# and moves with each release, so an update could otherwise break CI.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# examples/ holds a test file for users to copy; tests/test_api.py runs it.
testpaths = ["tests"]
# pytest 9 strict mode: an unknown marker, a misspelt option here or an xfail that
# passes is an error, not a warning. A warning raised by the suite is an error too.
strict = true
filterwarnings = ["error"]
